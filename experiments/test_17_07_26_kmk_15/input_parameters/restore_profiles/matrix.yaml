schema_version: 1
operator:
  source: file
  manifest: input_artifacts/operators/matrix/manifest.yaml
forward_modeling:
  enabled: false
detectors:
  camera:
    use_background: true
  line_sensor:
    use_background: true
solver:
  type: tikhonov_nnls
  regularization_order: 1
  regularization_alpha: best
  use_w_critical: false
  use_chahine: true
  use_concentration_correction: true
class_slice:
  drop_first: 10
  drop_last: null
