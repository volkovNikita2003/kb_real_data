schema_version: 1
mode: automatic

# Все поля внутри секции необязательны; показаны значения по умолчанию.
camera:
  pinhole_diameter_um: 200.0
  gaussian_sigma_px: 20.0
  correct_pixel_size: true

# Поля pinhole_position_m и signal_position_m обязательны
# для остальных показаны значения по умолчанию.
line_sensor:
  pinhole_diameter_um: 200.0
  gaussian_sigma_px: 3.0
  time_offset_us: 2.0
  pixel_count: 3643
  pixel_width_um: 8.0
  pixel_height_um: 200.0
  pinhole_position_m: 0.0002
  signal_position_m: 0.0203
