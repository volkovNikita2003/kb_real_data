# Версия схемы файла. Обязательное поле; сейчас поддерживается только 1.
schema_version: 1
# Способ получения итоговой калибровки. Обязательное поле; сейчас доступно
# только automatic — вычислить параметры по сигналам калибровочного пинхола.
mode: automatic

# Параметры калибровки камеры. Секция должна присутствовать тогда и только
# тогда, когда камера включена в general.yaml.
camera:
  # Известный диаметр калибровочного пинхола, мкм. Положительное число;
  # значение по умолчанию 200.
  pinhole_diameter_um: 200.0
  # Сигма гауссового сглаживания калибровочного HDR-изображения, пиксели.
  # Положительное число; значение по умолчанию 20.
  gaussian_sigma_px: 20.0
  # Нужно ли корректировать физический размер пикселя по фиту дифракционной
  # картины: true — применить найденный масштаб; false — оставить номинальный
  # размер из general.yaml. Значение по умолчанию true.
  correct_pixel_size: true
  # Настройки сборки калибровочного HDR-изображения камеры.
  hdr:
    # Правило выбора экспозиции для каждого пикселя:
    # l2h — первая допустимая экспозиция при обходе от короткой к длинной;
    # l2h_longest — самая длинная из допустимых экспозиций, то же, что раньше h2l.
    # Значение по умолчанию l2h.
    mode: l2h
    # Порядок вычитания фона:
    # after_hdr — отдельно собрать HDR сигнала и фона, затем вычесть;
    # per_exposure — сначала вычесть фон каждой экспозиции, затем собрать HDR.
    # Значение по умолчанию after_hdr.
    difference_mode: after_hdr
    # Постоянный фоновой уровень камеры, отсчёты пикселя. Число от 0 до 255;
    # значение по умолчанию 12.
    background_level: 12.0
    # Нижний порог допустимого значения пикселя. Число от 0 до 255;
    # значение по умолчанию 10 и должно быть меньше top_threshold.
    low_threshold: 10.0
    # Верхний порог допустимого несатурированного значения пикселя.
    # Число в диапазоне (0, 255]; по умолчанию 240 и больше low_threshold.
    top_threshold: 240.0

# Параметры калибровки линейки. Секция должна присутствовать тогда и только
# тогда, когда линейка включена в general.yaml.
line_sensor:
  # Координата пинхола при калибровке линейки, м. Обязательное конечное число;
  # знак и начало координат определяются принятой геометрией установки.
  # Равно показанию микровинта при калибровке линейки.
  # Это значение пишется в excel таблице.
  pinhole_position_m: 0.0002
  # Координата линейки в рабочем положении регистрации сигнала, м.
  # Обязательное конечное число в той же системе координат, что и pinhole_position_m.
  # Равно показанию микровинта при рабочем положении линейки.
  # Это значение пишется в excel таблице.
  signal_position_m: 0.0203
  # Известный диаметр калибровочного пинхола, мкм. Положительное число;
  # значение по умолчанию 200.
  pinhole_diameter_um: 200.0
  # Сигма гауссового сглаживания сигнала линейки, пиксели.
  # Положительное число; значение по умолчанию 3.
  gaussian_sigma_px: 3.0
  # Добавка к указанному в имени файла времени экспозиции линейки, мкс,
  # компенсирующая временную задержку электроники. Неотрицательное число;
  # значение по умолчанию 2.
  time_offset_us: 2.0
