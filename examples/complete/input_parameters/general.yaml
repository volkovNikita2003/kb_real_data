# Версия схемы файла. Обязательное поле; сейчас поддерживается только 1.
schema_version: 1

# Физическая геометрия детекторов эксперимента. Обязательна хотя бы одна
# секция: camera или line_sensor. Отсутствие секции означает, что детектора нет.
detectors:
  # Наличие секции включает камеру для всех этапов эксперимента.
  camera:
    # Число пикселей изображения по горизонтали. Положительное целое;
    # значение по умолчанию 2592.
    width_px: 2592
    # Число пикселей изображения по вертикали. Положительное целое;
    # значение по умолчанию 1944.
    height_px: 1944
    # Номинальный физический размер пикселя по горизонтали, м.
    # Положительное число; по умолчанию 1.8965517241379312e-6 = 2.2e-6/0.58/2.
    pixel_width_m: 0.0000018965517241379312
    # Номинальный физический размер пикселя по вертикали, м.
    # Положительное число; по умолчанию 1.8965517241379312e-6= 2.2e-6/0.58/2.
    pixel_height_m: 0.0000018965517241379312

  # Наличие секции включает линейный сенсор для всех этапов эксперимента.
  line_sensor:
    # Полное число пикселей линейки. Положительное целое;
    # по умолчанию 3643 - обычно столько значений выдает линейка.
    pixel_count: 3643
    # Физический шаг пикселей вдоль линейки, м. Положительное число;
    # значение по умолчанию 8e-6.
    pixel_width_m: 0.000008
    # Физическая высота чувствительной области пикселя, м. Положительное число;
    # значение по умолчанию 2e-4.
    pixel_height_m: 0.0002

# Общие параметры оптической схемы.
instrument:
  # Положение детекторов относительно лазерного пучка. Обязательное поле:
  # old — старая схема до 17.07.26, камера и линейка справа от пучка;
  # new — новая схема с 17.07.26, камера и линейка слева от пучка.
  detector_position: new
  # Длина волны лазера в вакууме, мкм. Положительное число;
  # значение по умолчанию 0.633.
  wavelength_um: 0.633
  # Фокусное расстояние собирающей линзы, мкм. Положительное число;
  # значение по умолчанию 400000.
  focal_length_um: 400000.0
