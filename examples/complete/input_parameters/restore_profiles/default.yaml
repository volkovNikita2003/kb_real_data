schema_version: 1

detectors:
  camera:
    use_background: true
    hdr:
      mode: l2h
      difference_mode: after_hdr
      background_level: 12.0
      low_threshold: 10.0
      top_threshold: 240.0
      filtered: false
      gaussian_sigma: 5.0
  line_sensor:
    use_background: true
    signal_mode: 2
    time_offset_us: 2.0

solver:
  type: tikhonov_nnls
  regularization_order: 1
  regularization_alpha: best
  use_w_critical: false
  use_chahine: true
  use_concentration_correction: true

class_slice:
  drop_first: 10
  drop_last: null
