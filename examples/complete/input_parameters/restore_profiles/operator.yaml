# Версия схемы файла. Обязательное поле; сейчас поддерживается только 1.
schema_version: 1

# Источник аппаратной матрицы. Возможные значения:
# operator.source: darl (смотри профиль default.yaml)
# operator.source: file
# Если секция отсутствует, используется режим darl для обратной совместимости.
operator:
  source: file
  manifest: input_artifacts/operators/matrix/manifest.yaml

# Повторно рассчитать сигналы детекторов для восстановленного распределения.
# Операция выполняется отдельной программой прямого моделирования и может быть
# длительной. Доступна только при operator.source: darl; по умолчанию false.
forward_modeling:
  enabled: false

# Детекторы, сигналы которых используются в этом профиле восстановления.
# Обязательна хотя бы одна секция; разрешено подмножество детекторов general.yaml.
# Текущий legacy-алгоритм требует камеру: поддерживаются camera и
# camera + line_sensor, но не line_sensor без камеры.
detectors:
  # Параметры обработки реального сигнала камеры.
  camera:
    # Использование data/<measurement>/cam_back:
    # true — фон обязателен и вычитается;
    # false — фон не используется, а существующая директория даёт warning.
    # Значение по умолчанию true.
    use_background: true
    # Настройки сборки HDR-изображения реального сигнала.
    hdr:
      # Правило выбора экспозиции для каждого пикселя:
      # l2h — первая допустимая экспозиция от короткой к длинной;
      # l2h_longest — самая длинная из допустимых экспозиций, то же, что раньше h2l.
      # Значение по умолчанию l2h.
      mode: l2h
      # Порядок вычитания фона:
      # after_hdr — собрать HDR сигнала и фона отдельно, затем вычесть;
      # per_exposure — вычесть фон каждой экспозиции до сборки HDR.
      # Значение по умолчанию after_hdr.
      difference_mode: after_hdr
      # Постоянный фоновой уровень камеры, отсчёты пикселя. Число от 0 до 255;
      # значение по умолчанию 12.
      background_level: 12.0
      # Нижний порог допустимого значения пикселя. Число от 0 до 255;
      # значение по умолчанию 10 и должно быть меньше top_threshold.
      low_threshold: 10.0
      # Верхний порог допустимого несатурированного значения пикселя.
      # Число в диапазоне (0, 255]; по умолчанию 240 и больше low_threshold.
      top_threshold: 240.0
      # Дополнительное гауссово сглаживание собранного HDR:
      # true — применить; false — оставить без этого сглаживания.
      # Значение по умолчанию false.
      filtered: false
      # Сигма дополнительного гауссова фильтра, пиксели. Положительное число;
      # значение по умолчанию 5. Учитывается при filtered: true.
      gaussian_sigma: 5.0

  # Параметры обработки реального сигнала линейки.
  line_sensor:
    # Использование data/<measurement>/lin_back:
    # true — требуется ровно один фон с той же экспозицией;
    # false — фон не используется, а существующая директория даёт warning.
    # Значение по умолчанию true.
    use_background: true
    # Обработка отрицательных значений после вычитания фона:
    # 1 — вычесть минимальное значение сигнала на зарегистрированных пикселях;
    # 2 — заменить отрицательные значения нулями.
    # Значение по умолчанию 2.
    signal_mode: 2
    # Добавка к указанному в имени файла времени экспозиции линейки, мкс,
    # компенсирующая временную задержку электроники. Неотрицательное число;
    # значение по умолчанию 2.
    time_offset_us: 2.0

# Настройки решения обратной задачи. Секция опциональна.
solver:
  # Алгоритм решения. Сейчас поддерживается только tikhonov_nnls —
  # регуляризация Тихонова с ограничением решения неотрицательными значениями.
  type: tikhonov_nnls
  # Порядок разностного оператора регуляризации:
  # 0 — штраф за величину распределения;
  # 1 — штраф за первую разность (наклон);
  # 2 — штраф за вторую разность (кривизну).
  # Значение по умолчанию 1.
  regularization_order: 1
  # Коэффициент регуляризации:
  # best — автоматически выбрать по минимуму GCV;
  # положительное число — использовать заданное фиксированное значение.
  # Значение по умолчанию best.
  regularization_alpha: best
  # Отсекать компоненты ниже порога W_CRITICAL:
  # true — включить отсечение; false — не применять. По умолчанию false.
  use_w_critical: false
  # Порог отсечения W_CRITICAL. Компоненты с относительным весом ниже этого
  # положительного числа отбрасываются, если use_w_critical: true.
  # Значение по умолчанию 0.001.
  w_critical: 0.001
  # Выполнить после регуляризованного решения итерации:
  # true — выполнить; false — оставить исходное решение. По умолчанию true.
  use_chahine: true
  # Применить коррекцию концентрации при итерационном восстановлении:
  # true — применить,  итоговое решение — в штуках частиц; 
  # false — отключить, итоговое решение — в долях гостовской концентрации.
  # По умолчанию true.
  use_concentration_correction: true

# Обрезка столбцов аппаратной матрицы и соответствующих классов частиц перед
# дополнительным восстановлением. Секция опциональна.
class_slice:
  # Число классов, удаляемых с начала массива (наименьшие размеры).
  # Неотрицательное целое; значение по умолчанию 10.
  drop_first: 10
  # Индекс правой границы Python-среза: классы с этого индекса и далее
  # исключаются. Неотрицательное целое или null; null означает не обрезать
  # верхнюю границу. Значение по умолчанию null.
  drop_last: null
