# Версия схемы файла. Обязательное поле; сейчас поддерживается только 1.
schema_version: 1

# Предполагаемое распределение частиц конкретного измерения. Весь файл
# опционален; если он отсутствует, DARL не моделирует ожидаемый сигнал образца.
expected_distribution:
  # Математическая форма распределения. Обязательное поле; сейчас доступно
  # только gaussian — нормальное распределение числа частиц по диаметру.
  type: gaussian
  # Математическое ожидание диаметра частиц, нм. Положительное число.
  mean_nm: 15000.0
  # Стандартное отклонение диаметра частиц, нм. Положительное число.
  sigma_nm: 3000.0
  # Полное число частиц в модельном распределении. Положительное число;
  # может быть нецелым коэффициентом нормировки.
  particle_count: 1000000.0
