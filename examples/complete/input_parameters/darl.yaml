# Версия схемы файла. Обязательное поле; сейчас поддерживается только 1.
schema_version: 1

# Детекторы, включаемые в прямое моделирование. Обязательна хотя бы одна
# секция. Набор секций должен точно совпадать с general.yaml.
detectors:
  # Наличие пустой секции включает переднюю матрицу камеры. У камеры в DARL
  # пока нет собственных пользовательских параметров.
  camera: {}
  # Наличие секции включает переднюю логарифмическую линейку.
  line_sensor:
    # Относительный логарифмический радиус бина линейки, %. Положительное
    # число; значение по умолчанию 7.5.
    logarithmic_radius_percent: 7.5

# Параметры моделируемого лазера. Секция и все её поля опциональны.
laser:
  # Угол направления лазера, градусы. Любое конечное число; по умолчанию 0.
  angle_deg: 0.0
  # Этап, к которому относится лазер. Положительное целое; по умолчанию 1.
  # В legacy-модели 1 используется для больших частиц, 2 — для маленьких;
  # при текущем типе контрольного восстановления используется этап 1.
  stage: 1
  # Мощность лазера, Вт. Положительное число; значение по умолчанию 30.
  power_w: 30.0
  # Поляризация лазера:
  # parallel — линейная, параллельная опорной плоскости рассеяния;
  # perpendicular — линейная, перпендикулярная опорной плоскости;
  # unpolarized — неполяризованный свет.
  # Значение по умолчанию parallel.
  polarization: parallel

# Способ вычисления сигнала детекторов. Секция опциональна.
signal:
  # Нормировка по количеству частиц:
  # true — вернуть отклик одной частицы;
  # false — учитывать число частиц в распределении.
  # Значение по умолчанию false.
  one_particle: false
  # Величина, записываемая для каждого бина:
  # signal — интегральный сигнал бина;
  # intensity — сигнал, делённый на площадь бина.
  # Значение по умолчанию signal.
  value_type: signal

# Оптические параметры частиц. Секция и первые три поля обязательны.
particles:
  # Действительная часть комплексного показателя преломления частиц.
  # Положительное число.
  refractive_index: 1.77
  # Мнимая часть комплексного показателя преломления, характеризующая
  # поглощение. Неотрицательное число: 0 означает отсутствие поглощения.
  absorption_coefficient: 0.0
  # Геометрическая модель частицы:
  # sphere — сферическая частица;
  # rectangle — прямоугольная частица в модели Фраунгофера.
  type: sphere
  # Отношение сторон прямоугольной частицы. Положительное число; по умолчанию
  # 1.5. Используется только при type: rectangle.
  rectangle_aspect_ratio: 1.5

# Показатели преломления материалов оптического тракта. Все поля обязательны
# и должны быть положительными числами.
medium:
  # Показатель преломления среды с образцом внутри кюветы.
  inside_cuvette_refractive_index: 1.3333
  # Показатель преломления материала стенок кюветы.
  cuvette_refractive_index: 1.5
  # Показатель преломления среды между кюветой и внешней оптикой.
  outside_cuvette_refractive_index: 1.0

# Сетка классов размеров частиц. Секция опциональна; ниже приведены все поля
# и их значения по умолчанию.
particle_classes:
  # Общий алгоритм разбиения. Целое; сейчас поддерживается только 1 —
  # равномерный шаг в области Ми и логарифмические классы во Фраунгофере.
  split_type: 1
  # Нижняя граница первого класса, нм. Положительное число; по умолчанию 100.
  min_diameter_nm: 100.0
  # Верхняя граница последнего класса, нм. Положительное число;
  # по умолчанию 3500000.
  max_diameter_nm: 3500000.0
  # Диаметр перехода от расчёта Ми к приближению Фраунгофера, нм.
  # Положительное число; по умолчанию 10000. Должно выполняться:
  # min_diameter_nm < значение < max_diameter_nm.
  mie_fraunhofer_boundary_nm: 10000.0
  # Постоянная ширина класса в области Ми, нм. Положительное число;
  # значение по умолчанию 300.
  mie_class_size_nm: 300.0
  # Способ логарифмического роста классов в области Фраунгофера:
  # 1 — logarithmic radius: каждая следующая граница увеличивается на процент;
  # 2 — logarithmic step: на процент увеличивается ширина следующего класса.
  # Значение по умолчанию 1.
  fraunhofer_log_type: 1
  # Относительное увеличение радиуса или шага (в зависимости от предыдущего
  # поля), %. Положительное число; значение по умолчанию 7.5.
  fraunhofer_log_percent: 7.5
